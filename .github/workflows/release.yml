name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:e2e
      - run: npm run dist
      - run: npm run test:packaged
      - run: npm run test:installer
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = "release/NCMSync-$version-Setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLower()
          "$hash  NCMSync-$version-Setup.exe" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          gh release create $env:GITHUB_REF_NAME `
            "release/NCMSync-$version-Setup.exe" `
            "release/SHA256SUMS.txt" `
            --title "NCM Sync $version" `
            --notes-file $notes
